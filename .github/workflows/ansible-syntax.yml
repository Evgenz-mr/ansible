name: ansible-syntax
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Ansible
        run: pip install ansible-core
      - name: Syntax check
        run: ansible-playbook -i inventory tomcat_provision.yml --syntax-check
